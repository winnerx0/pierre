description = "Add your description here"
readme = "README.md"
authors = [
    { name = "winnerx0", email = "eragbonikpeya@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.103",
    "fastapi[standard]>=0.141.1",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "minio>=7.2.20",
    "ollama>=0.6.2",
